# registry/capability_lanes.yaml — v0.1
# Capability Lane：把「capability（工作型態）」對應到「實際執行通道
# （provider／model／Hermes profile／成本／風險／工具邊界）」的治理中繼資料。
# 概念說明與欄位定義見 docs/capability-lanes.md。
#
# 跟既有 registry 的關係（不取代、不矛盾）：
# - capability 的「名字」正本仍是 registry/model_router.yaml 的 routes——
#   本檔每個 lane 的 capability 欄位必須是那裡存在的 key（有一致性測試：
#   scripts/test_capability_lanes.py）。
# - agents.yaml 的 default_capability 機制不變：subagent 查 default_capability
#   → route_model.py 解析 model_router.yaml 執行。本檔不是 route_model.py 的
#   輸入，執行邏輯完全不變；lane 是給 CoS／subagent／未來 Stage 2 bridge 做
#   「選哪條通道、允許誰用、成本風險是什麼」判斷用的描述層。
# - execution: route_model 的 lane，其 provider/model 內容跟 model_router.yaml
#   的對應 route 一致（openrouter lane 的 model 必須等於 route 的
#   openrouter_model，一致性測試會查）。要改模型 slug，改 model_router.yaml，
#   這裡跟著同步——真相來源仍是 model_router.yaml。
# - execution: hermes_profile 的 lane 是描述既有 Hermes profile（實際存在於
#   %LOCALAPPDATA%\hermes\profiles\）的通道；模型與工具設定由該 profile 自己的
#   config 決定，本檔不重複記載、不宣稱。
#   v0.1（Domain Execution Router，scripts/dispatch_domain.py，Phase 1）起：
#   這類 lane「有 runtime 能執行」跟「status 是不是 active」是兩件事——
#   dispatch_domain.py 的自動選路徑只會挑 status=active 的 lane（不主動改變
#   既有行為），但操作者可以用 dispatch_domain.py 的 --lane 明確指到任何一條
#   hermes_profile lane，這種情況下 Router 真的會用明確 --profile 呼叫
#   hermes -z 執行它——這一點在 status=reference 與 status=active 底下都成立，
#   不受這次轉換影響。
#   Phase 2d（2026-07-20）：對這四條 hermes-* lane（原五條，hermes-codereviewer
#   已於同日 Phase 2a 隨 codereviewer profile 移除的決定一併下線登記）各跑了一次
#   真實（非 mock）端對端 smoke test，全部成功——回應內容、provider/model、
#   token 用量都跟 lane 宣告吻合。四條 lane 因此由 reference 轉 active。
#   同一次真實呼叫的 JSON envelope 也帶回 usage.cost_status 欄位，解掉 Phase 2a
#   稽核當時卡住的 openai-codex 訂閱制成本盤點問題：hermes-gptcoding／
#   hermes-financialresearch／hermes-intelligence 回報 cost_status: "included"
#   （訂閱內、無額外計費），cost_tier 因此由 unknown 改記 included；
#   hermes-nemocoding（OpenRouter 免費層）回報 cost_status: "estimated"，與既有
#   free 判定一致，維持不變。詳細依據見各 lane 內的稽核／複查註記。
#   status=active 的語意不變：自動選路徑「會」把這四條 lane 納入候選（capability
#   相同、owner 在 allowed_agents 內即可能被選中）；candidates[0] 邏輯下哪條
#   lane 被自動選中，取決於目前檔案順序，不是額外的優先權保證——若在這四條
#   之前插入其他 active lane、或這四條彼此之間的順序調整，自動選路徑的預設
#   結果會跟著變。
#   2026-07-20：原本 complex_coding／bulk_research 兩個 capability 各自還有一條
#   OpenRouter route_model lane（openrouter-gpt55-coding／
#   openrouter-nemotron-bulk-research）排在這四條 hermes-* lane 之前；使用者
#   拍板全面移除 OpenRouter provider 相關路徑後，這兩條 lane（連同
#   openrouter-gemini-google-ecosystem）已一併刪除，engineering／intelligence
#   的 default_capability 改成 claude_native。這四條 hermes-* lane 的內容
#   本身未變動，但因為同 capability 的 OpenRouter 候選已不存在，自動選路徑
#   現在實際上會直接選到這四條裡排序最前的一條（除非明確用 --lane 指定）。
#   Stage 2 bridge 的 selected_capability_lane 欄位會引用這裡的 lane id 做記錄
#   與追蹤。
#
# 欄位說明（完整定義見 docs/capability-lanes.md）：
#   id                lane 唯一識別（本檔內唯一；bridge state 等外部記錄引用這個）
#   capability        對應 model_router.yaml routes 的 key
#   execution         route_model | hermes_profile | native
#   provider          anthropic | openrouter | hermes
#   model             實際模型 slug；native/hermes_profile lane 可為 null
#   hermes_profile    （選填）對應的 Hermes profile 名稱
#   status            active（今天就可走）| reference（描述性，尚未接線）
#   cost_tier         included | free | paid | unknown（unknown 僅限 status: reference
#                     的 lane——Hermes profile 的實際模型成本由 profile config 決定，
#                     尚未盤點前不瞎編）
#   risk_tier         low | medium | high
#   allowed_agents    允許使用這條 lane 的 domain agent id（agents.yaml）
#   intended_use      一句話說明這條 lane 該用在什麼工作
#   guardrails        使用限制清單（沿用 docs/memory-taxonomy.md 的既有規則用詞）
#   fallback_lane     （選填）此 lane 不可用時退到哪條 lane

schema: claudecodeos.capability_lanes.v1

lanes:
  # ---- model_router.yaml 對應的 lanes（今天就可經 route_model.py 走）----

  - id: claude-native
    capability: claude_native
    execution: native
    provider: anthropic
    model: null            # 由目前的 Claude session 直接處理，不對外呼叫
    status: active
    cost_tier: included
    risk_tier: low
    allowed_agents: [automation, knowledge, planning, engineering, intelligence]
    intended_use: 本來就該由 Claude 原生處理的領域工作（automation/knowledge/planning 的預設通道）
    guardrails:
      - 遵守 delegation policy 與各 domain 邊界，無額外通道限制
      - headless 模式下只能新增 memory/inbox/ 檔案，不可編輯正本（ARCHITECTURE.md 第 4 節）

  - id: claude-architecture-reasoning
    capability: architecture_reasoning
    execution: native
    provider: anthropic
    model: null
    status: active
    cost_tier: included
    risk_tier: low
    allowed_agents: [engineering]
    intended_use: 工程／CoS 情境的架構推理（model_router.yaml 註明此命名保留給工程情境，不借給其他領域）
    guardrails:
      - 命名邊界：automation/knowledge/planning 請走 claude-native，不借用這條 lane

  # 2026-07-20：原本這裡有 openrouter-gpt55-coding／openrouter-gemini-google-
  # ecosystem／openrouter-nemotron-bulk-research 三條 OpenRouter lane，對應
  # model_router.yaml 已移除的 complex_coding／google_ecosystem／bulk_research
  # 三個 route。OPENROUTER_API_KEY 從未真正設定過，這三條路徑實務上從未打通；
  # 使用者拍板全部移除，engineering／intelligence 改用 claude-native（見上）。

  # ---- Hermes profile 對應的 lanes（模型/工具設定由 profile config 決定，本檔不重複記載）----
  # 這些 profile 實際存在於 Windows Hermes（%LOCALAPPDATA%\hermes\profiles\）。
  # ClaudeCodeOS 對 Hermes 資料一律唯讀（HermesSessionAdapter，mode=ro）。
  # Phase 2d（2026-07-20）起：這四條 lane 皆已通過真實端對端 smoke test 並轉
  # status=active——dispatch_domain.py 的自動選路徑與明確 --lane 兩種路徑都能
  # 真的執行它們（明確 --lane 一直都能，見上方大段註記）。

  - id: hermes-nemocoding
    capability: complex_coding
    execution: hermes_profile
    provider: hermes
    model: null                    # 由 profile 自身設定決定，本 registry 不重複記載
    hermes_profile: nemocoding
    status: active
    cost_tier: free                # Phase 2a 稽核（2026-07-20）：config.yaml 宣告
                                    # provider: openrouter，model:
                                    # nvidia/nemotron-3-ultra-550b-a55b:free；`:free`
                                    # 後綴 = OpenRouter 免費層。auth.json 的
                                    # credential_pool.openrouter 有對應 entry
                                    # （source: env:OPENROUTER_API_KEY，last_status: ok）
                                    # ，declared provider 與實際可用憑證吻合。
                                    # Phase 2d（2026-07-20，同日稍晚）：真實（非
                                    # mock）dispatch_domain.py 呼叫的 JSON envelope
                                    # usage.cost_status 回報 "estimated"，與既有
                                    # free 判定一致，維持不變；status 隨此次真實
                                    # smoke test 通過由 reference 轉 active。
                                    # Phase 2h（2026-07-21）：延續 hermes-gptcoding
                                    # Phase 2g 同一批清理，nemocoding 本地
                                    # credential_pool.openai-codex 原本也有兩筆——
                                    # id 62a425（與 default/gptcoding/
                                    # financialresearch 共用的舊裝置授權，同一顆
                                    # 跨 profile 共用，有 refresh_token_reused/
                                    # invalid_grant 風險）與 id 73d8d8（label
                                    # openai-codex-oauth-2，這次任務新做的
                                    # nemocoding 專屬獨立 OAuth 裝置授權登入，
                                    # 觸發 log 確認出現 "Added openai-codex OAuth
                                    # credential #2"）。先在 pool 仍是兩筆時跑一次
                                    # 真實呼叫（usage envelope：provider:
                                    # openrouter、completed: true）確認 profile
                                    # 整體打通，再用官方 `hermes --profile
                                    # nemocoding auth remove openai-codex 62a425`
                                    # 指令移除舊憑證（該指令自動寫入
                                    # suppressed_sources，避免下次 load_pool()
                                    # 重新種回共用憑證）。移除後以白名單欄位
                                    # （id/priority/last_status/last_refresh/
                                    # provider/source/label，不印出 token 明文）
                                    # 確認 pool 只剩 73d8d8 一筆，再做一次真實
                                    # 呼叫（provider: openrouter、completed:
                                    # true）確認呼叫後 pool 依然穩定只有一筆。
                                    # 補充：nemocoding 的主要功能實際是走
                                    # openrouter（見本欄前段 Phase 2a/2d 稽核），
                                    # 這次 openai-codex 憑證清理純粹是跨 profile
                                    # 一致性整理，不影響 nemocoding 平常實際使用
                                    # 的 lane 邏輯；cost_tier（free）與 risk_tier
                                    # 皆維持不變。
    risk_tier: medium
    allowed_agents: [engineering]
    intended_use: Hermes 側的 Nemotron coding profile；session 產出經 Stage 2 bridge／to-inbox 才進入本系統
    guardrails:
      - ClaudeCodeOS 不寫入 Hermes 資料；session 內容進入記憶一律走 memory/inbox/ 政策（memory-taxonomy 4.2/4.3）
      - 自動化呼叫 Hermes CLI 一律明確 --profile（sticky profile 風險，Stage 0 報告既有結論）

  - id: hermes-gptcoding
    capability: complex_coding
    execution: hermes_profile
    provider: hermes
    model: null
    hermes_profile: gptcoding
    status: active
    cost_tier: included            # Phase 2a 稽核（2026-07-20）：config.yaml 宣告
                                    # provider: openai-codex，model: gpt-5.6-sol
                                    # （ChatGPT backend-api/codex，OAuth）。auth.json
                                    # 的 credential_pool.openai-codex 確實有對應
                                    # OAuth entry（source: device_code，last_status:
                                    # ok）——宣告與憑證吻合，非稽核前懷疑的「設定跟
                                    # 認證對不上」。但 openai-codex OAuth 走 ChatGPT
                                    # 訂閱制，本檔查不到綁定的訂閱方案（Plus/Pro/
                                    # 其他），無法確認是 included 還是 paid，故維持
                                    # unknown，不瞎猜。（原註記誤植 model 為
                                    # gpt-5.6-terra——那其實是 hermes-intelligence 的
                                    # model；本次任務 2026-07-20 複查時一併修正，並
                                    # 重新核對 config.yaml/auth.json，判斷仍成立。）
                                    # Phase 2d（2026-07-20，同日稍晚）：對這條 lane 跑
                                    # 了一次真實（非 mock）dispatch_domain.py 呼叫，
                                    # 回傳 JSON envelope 的 usage.cost_status 欄位為
                                    # "included"——API 回應本身給出的訂閱內判斷，不是
                                    # 臆測，unknown 因此解除，改記 included；status
                                    # 隨此次真實 smoke test 通過由 reference 轉
                                    # active。
                                    # Phase 2g（2026-07-21）：延續 hermes-intelligence
                                    # Phase 2e／hermes-financialresearch Phase 2f
                                    # 同一批清理，gptcoding 本地
                                    # credential_pool.openai-codex 原本也有兩筆——
                                    # id 62a425（與 default/nemocoding/
                                    # financialresearch 共用的舊裝置授權，單次使用、
                                    # 會輪替失效，多 profile 共用同一顆有
                                    # refresh_token_reused/invalid_grant 風險）與
                                    # id a3ca26（label openai-codex-oauth-2，這個
                                    # profile 先前已補做的專屬獨立 OAuth 登入，
                                    # 移除前尚未經真實呼叫驗證，last_status: None）。
                                    # 先在 pool 仍是兩筆的狀態下跑一次真實呼叫確認
                                    # 整體打通（usage envelope：provider:
                                    # openai-codex、model: gpt-5.6-sol、
                                    # completed: true、cost_status: "included"），
                                    # 再用官方 `hermes --profile gptcoding auth
                                    # remove openai-codex 62a425` 指令移除舊憑證——
                                    # 該指令會自動寫入
                                    # suppressed_sources.openai-codex:
                                    # ["device_code"] 抑制標記，阻止
                                    # _seed_from_singletons() 在下次 load_pool()
                                    # 時從 global-root 重新種回同一顆共用憑證。
                                    # 移除後以白名單欄位（id/priority/last_status/
                                    # last_refresh/provider，不印出 token 明文）
                                    # 確認 pool 只剩 a3ca26（label
                                    # openai-codex-oauth-2）一筆；接著再做一次真實
                                    # 呼叫，usage envelope 回報 provider:
                                    # openai-codex、model: gpt-5.6-sol、
                                    # completed: true、cost_status: "included"，
                                    # 證實單靠這筆專屬憑證即可正常運作；呼叫後複查
                                    # pool 仍穩定只有一筆，未被重新種回。結論：
                                    # gptcoding 現在也是靠自己獨立擁有的憑證運作，
                                    # 不再共用 default/nemocoding/financialresearch
                                    # 的裝置授權，共用憑證風險已解除。cost_tier
                                    # （included）與 risk_tier 皆維持不變——這次
                                    # 變動只影響憑證來源，不影響已由 Phase 2d 真實
                                    # smoke test 確認過的 provider/model/成本判斷。
    risk_tier: medium
    allowed_agents: [engineering]
    intended_use: Hermes 側的 GPT coding profile；同上，產出經 bridge／to-inbox 才進入本系統
    guardrails:
      - ClaudeCodeOS 不寫入 Hermes 資料；session 內容進入記憶一律走 memory/inbox/ 政策（memory-taxonomy 4.2/4.3）
      - 自動化呼叫 Hermes CLI 一律明確 --profile

  # hermes-codereviewer（codereviewer profile）已於 2026-07-20 Phase 2a 稽核移除——
  # 使用者拍板不留（Stage 0.5「codereviewer profile 去留」殘項定案，見
  # docs/hermes-integration-roadmap.md Stage 0.5 表格）。Windows 側 profile 實際刪除
  # （備份＋刪除）由 automation domain 平行處理，不在本檔範圍內；本檔僅移除對應 lane
  # 登記，避免留一條指向已不存在 profile 的 reference lane。

  - id: hermes-financialresearch
    capability: bulk_research
    execution: hermes_profile
    provider: hermes
    model: null
    hermes_profile: financialresearch
    status: active
    cost_tier: included             # Phase 2a 稽核（2026-07-20）判定 free 的依據已
                                     # 失效——那時 config.yaml 宣告 provider:
                                     # openrouter，model:
                                     # nvidia/nemotron-3-ultra-550b-a55b:free（跟
                                     # hermes-nemocoding 共用同一顆免費模型）。使用者
                                     # 之後在 Windows 端手動把這個 profile 改成
                                     # provider: openai-codex，model: gpt-5.6-luna，
                                     # 「跟 nemocoding 共用免費模型」的敘述已不成立。
                                     # openai-codex OAuth 走 ChatGPT 訂閱制，無法從
                                     # 憑證本身判斷免費/付費層，維持 unknown。
                                     # 複查一（2026-07-20 上午）：config.yaml 確認已
                                     # 吻合新設定；auth.json 的
                                     # credential_pool.openai-codex 有對應 OAuth
                                     # entry（id 62a425——與 default/gptcoding/
                                     # nemocoding pool 內的同一份裝置授權共用同一
                                     # id），但這個 profile 專屬副本的 last_status 是
                                     # null（last_refresh 05:06 UTC，剛 refresh 過，
                                     # 但尚未見過成功呼叫紀錄，跟 hermes-gptcoding
                                     # 副本的 last_status: ok 不同）。
                                     # 複查二（2026-07-20，同日稍晚）：使用者表示已在
                                     # CLI 手動呼叫確認這個 profile 的 openai-codex
                                     # 模型呼叫成功。重新讀取 auth.json 白名單欄位：
                                     # last_refresh 仍是 05:06:44Z（沒有更新的
                                     # refresh 紀錄），last_status 仍是 null，不是
                                     # ok——pool 的 bookkeeping 欄位不支持「已證實打
                                     # 通」的說法。agent.log 目前保留的範圍內也查不到
                                     # 任何一筆含 financialresearch 字樣的紀錄可佐證
                                     # 該次手動呼叫（有可能是日誌已輪替，也有可能是
                                     # 呼叫方式沒有寫進這個 log）。結論：使用者所稱
                                     # 「已確認打通」目前查無憑證面證據支持，也查無
                                     # 反證；如實記錄為未證實，2d smoke test 前建議
                                     # 直接排一次這個 profile 的真實呼叫，看
                                     # last_status 會不會轉成 ok。
                                     # Phase 2d（2026-07-20，同日稍晚）：真實（非
                                     # mock）dispatch_domain.py 呼叫已執行且成功，
                                     # 回傳 JSON envelope 的 usage.cost_status 欄位為
                                     # "included"——這是這次真實呼叫本身給出的訂閱內
                                     # 判斷，直接解決了複查一／複查二遺留的「查無憑證
                                     # 面證據」問題（不必再靠 auth.json 的
                                     # last_status/last_refresh 佐證，這次是呼叫本身
                                     # 成功並回報成本狀態）。cost_tier 由 unknown 改記
                                     # included；status 隨此次真實 smoke test 通過由
                                     # reference 轉 active。
                                     # Phase 2f（2026-07-20，同日再稍晚）：延續
                                     # hermes-intelligence Phase 2e 同一批清理，
                                     # financialresearch 本地 credential_pool.
                                     # openai-codex 原本也有兩筆——id 62a425（與
                                     # default/gptcoding/nemocoding 共用的舊裝置
                                     # 授權，即上方複查一／複查二提到的那顆）與
                                     # id f16502（label openai-codex-oauth-2，這個
                                     # profile 先前已補做的專屬獨立 OAuth 登入）。
                                     # 共用 refresh token 屬單次使用、會輪替失效，
                                     # 多 profile 共用同一顆有 refresh_token_reused/
                                     # invalid_grant 風險，因此移除 62a425、只留
                                     # f16502。這次直接用官方
                                     # `hermes --profile financialresearch auth
                                     # remove openai-codex 62a425` 指令（而非手動
                                     # 編輯 JSON）完成——該指令內部
                                     # （credential_sources.py
                                     # _remove_codex_device_code）本就會清空
                                     # profile 本地 auth store 的 openai-codex 區塊，
                                     # 並自動寫入 suppressed_sources.openai-codex:
                                     # ["device_code"] 抑制標記，阻止
                                     # _seed_from_singletons() 在下次 load_pool()
                                     # 時從 global-root 重新種回同一顆共用憑證——
                                     # 與 Phase 2e 為 intelligence 手動補寫的效果
                                     # 相同，這次不必再手動編輯。移除後以白名單
