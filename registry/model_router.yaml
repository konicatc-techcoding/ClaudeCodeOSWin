# registry/model_router.yaml — v0.1
# Domain subagent 只請求「能力」（capability），不直接指定模型名稱。
# 實際呼叫由 scripts/route_model.py 解析這份設定並透過 OpenRouter 執行。
#
# openrouter_model 是 OpenRouter 上的實際 model slug。
# TODO: 使用前請到 openrouter.ai/models 確認正確的 slug，這裡先放常見命名的佔位值。

default: claude

routes:
  complex_coding:
    model: gpt-5.5
    via: openrouter
    openrouter_model: openai/gpt-5.5   # TODO: 確認實際 slug

  architecture_reasoning:
    model: claude
    via: native   # 直接由目前的 Claude session 處理，不對外呼叫

  claude_native:
    model: claude
    via: native   # 跟 architecture_reasoning 行為相同（native），但這個命名是給
                  # automation/knowledge/planning 這類「本來就該用 Claude」的領域用，
                  # 不要借用 architecture_reasoning 這個為了工程/CoS 情境取的名字

  google_ecosystem:
    model: gemini
    via: openrouter
    openrouter_model: google/gemini-3-pro   # TODO: 確認實際 slug

  bulk_research:
    model: nemotron
    via: openrouter
    cost_tier: free
    openrouter_model: nvidia/nemotron-70b-instruct   # TODO: 確認實際 slug

fallback_order: [claude, gpt-5.5, gemini, nemotron]
