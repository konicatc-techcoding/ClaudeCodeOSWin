# systemd user drop-in 範本 — 讓既有的 hermes-rss.service 順便產出 jobs.db 快照
#
# ⚠️ 本檔只是**範本**，放在 repo 裡供複製；它不在任何生效路徑上。
#    安裝與否由使用者決定（engineering 不建立、不修改任何排程）。
#
# ## 為什麼掛在 hermes-rss.service 上
#
# 拍板前提：**不新增 Task Scheduler 工作、不新增 systemd timer**。既有可用的
# 觸發點只有三個：hermes-rss.timer（每 30 分）、hermes-cron-daily-memory-check
# （每日 08:00）、hermes-bridge.timer（每日 08:10）。每日一次對快照太稀疏
# ——Jobs 頁會永遠顯示昨天的資料，新鮮度燈號也會天天處於「過期轉灰」。
# 所以掛在 30 分鐘那條上。
#
# ## 為什麼是 ExecStopPost 而不是 ExecStartPost
#
# `ExecStartPost` 只在 ExecStart **成功**時才跑——而「rss 這一輪失敗了」正是
# 最需要把資料推到觀測面的時候。`ExecStopPost` 在單元停止時一律執行（成功或
# 失敗都跑），這才是我們要的語意。
#
# ## 為什麼前面要加 `-`
#
# `-` ＝ 忽略這條指令的失敗。快照是**附掛的觀測用途**，絕不可以因為它失敗就
# 把 hermes-rss.service 標成 failed（那會製造一個假的故障訊號，比沒有快照更糟）。
# 快照真的失敗時，讀端會看到資料變舊並誠實顯示年齡——那才是正確的失效表現。
#
# ## 已知副作用（知情接受）
#
# 1. 快照時點緊貼 rss 那一輪的寫入尖峰，是最容易撞 WAL 的時刻。改用 SQLite
#    線上備份 API 後這不再是賽跑（引擎保證一致性），實測 85–110ms、一次成功；
#    真撞上也只是重試，最壞 fail-loud 而不留半份。
# 2. rss 單元若被停用／WSL 沒開，快照就停止更新——這**不是**靜默失效：
#    Web UI 會在 1.5 小時後標示「偏舊」、6 小時後整體轉灰。
# 3. 快照的節奏與 rss 綁定（30 分），日後若改 rss 節奏，快照節奏也會跟著變；
#    對應的門檻在 registry/jobs_watchdog.yaml 的 snapshot 區塊。
#
# ## 安裝（由使用者執行；前置：先 scripts/sync_to_wsl.sh --apply 把腳本同步過去）
#
#   mkdir -p ~/.config/systemd/user/hermes-rss.service.d
#   cp ~/dev/ClaudeCodeOSWin/scripts/jobs_snapshot_dropin.conf \
#      ~/.config/systemd/user/hermes-rss.service.d/10-jobs-snapshot.conf
#   systemctl --user daemon-reload
#   systemctl --user start hermes-rss.service    # 立刻驗一次（會順便跑一輪 rss）
#
# 移除：刪掉那個 .conf + daemon-reload，即完全回到原狀（原始 unit 未被修改）。

[Service]
ExecStopPost=-/home/razer/dev/ClaudeCodeOSWin/.venv/bin/python3 /home/razer/dev/ClaudeCodeOSWin/scripts/jobs_db_snapshot.py
