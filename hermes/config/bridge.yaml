# hermes/config/bridge.yaml — v0.1（Stage 2.4a）
#
# Session bridge 的政策層設定。與 cron_jobs.yaml / rss_feeds.yaml 同層慣例：
# 非密鑰、進版控、會被部署同步下發（不在 deployment-sync-plan 的排除清單）。
# 部署側的 runtime 狀態（watermark）另存 hermes/state/bridge_state.db 的
# bridge_meta table，兩者分層：這裡是「底線政策」，那裡是「可拋棄進度」。
#
# cutover：bridge 正式啟用日（UTC ISO 8601）。此時間點之前完結的 session 屬
# pre-bridge 歷史，不在自動掃描範圍（唯一有價值的舊 session 已於 Stage 2.3
# 由 reconcile 回填）。scanner 無 --since / --all-history 時的 effective since
# ＝ max(cutover, watermark)——cutover 是掃描範圍的絕對底線：即使部署側
# bridge_state.db（含 watermark）整個刪掉重建，自動掃描也絕不會越過這個值
# 往前掃到 pre-bridge 歷史。
#
# 變更此值的語義：
# - 往後調＝宣告「此日期前的 session 改列 pre-bridge 歷史」；watermark 較新時
#   effective since 取兩者較大值，已掃過的範圍不受影響。
# - 往前調＝擴大歷史掃描範圍——但 watermark 較新時不會生效（effective since
#   仍取較大值）；真的要回溯補掃請人工帶 --since 執行一次（人工覆蓋不受
#   watermark 影響，且掃完只會把 watermark 往前推、不會往回拉）。
# - scanner 讀不到本檔或缺 cutover 欄位時 fail loud（exit 1），絕不默認全掃。

cutover: "2026-07-10T00:00:00Z"

# max_import_retries（Stage 2.4c）：bridge importer（hermes/bridge_importer.py）
# 對同一 session 匯入失敗後的自動重試上限。前次 failed 的 session 重新嘗試時
# retry_count +1（bridge_state.increment_retry_count 的既定語義，與 jobs.attempts
# 不同層）；retry_count 達此值後不再自動嘗試，狀態轉 needs_review（人工檢視）。
# 欄位缺失時 importer 預設 3；設定檔本身讀不到時 fail loud（比照 cutover 慣例）。
max_import_retries: 3

# episodes（Stage 2.4d，提案 §1.3／§5.1）：Desktop 長壽 session 的 episode
# capture 政策層開關。與上面的 `cutover`（ended_at 掃描範圍底線）是兩個獨立
# 概念，互不綁架——episode_cutover 是「episode 擷取」的底線，不是「掃描層
# 歷史底線」的別名。
#
# - enabled：**2026-07-12 部署啟用（Stage 2.4d-4）**——scanner 對 episodes.enabled
#   為 false 或整個區塊缺失時，行為與 2.4c 位元級一致（零成本 gate，矩陣
#   #19 前半）；enabled: true 時走 episode 偵測邏輯。
# - episode_cutover：**2026-07-12T06:36:18Z**——2.4d-4 部署翻 enabled: true
#   前取當下實際 UTC 時刻寫入（已拍板 §0.1：是時刻不是日期概念值）。此值之前
#   的訊息永遠不會被 episode 擷取，即使 bridge_state.db 整個刪掉重建也不越過
#   （§5.1 的 pre-cutover 絕對底線）。
#   （manual checkpoint 子指令對「無 cursor 的 session」同樣需要這個值才能
#   決定擷取起點，缺失時同樣 fail loud——見 bridge_scanner.py checkpoint。）
# - inactivity_hours：已拍板 72（§0.1）——「暫時告一段落」的 checkpoint 門檻，
#   比「過幾天拿出來繼續用」的復用節奏保守；切早了無資料損失，只是同一主題
#   分成兩個 episode，consolidation 會再整併。
# - tool_output_max_chars（memory-lifecycle A1 拍板 (a)，2026-07-30）：episode
#   落地檔的 tool 輸出縮減——每則 tool 訊息保留 tool_name＋前 N 字元＋標注
#   `[truncated N chars]`；user/assistant 訊息完整保留。縮減只發生在「寫入
#   inbox 檔案」這一步，db 原文不動（隨時可回頭重讀）；敏感偵測在縮減前的
#   完整原文上跑（縮減不是漏檢通道）。欄位缺失時 importer 預設 500。
# - profiles（memory-lifecycle A1 多 profile 擴充，2026-07-30）：named profile
#   的 episode capture 掃描清單。分流規則：
#   * 主 db 的 session 依 profile_name 欄分流——空＝default（沿用上面的
#     episode_cutover），非空＝對應 named profile（namespace
#     "hermes/<profile>:<sid>:<first>..<last>"，2.4d §6.1 預留格式啟用；
#     裸 "hermes:" 恆等 default，不需 migration）；
#   * 每個 named profile 另掃自己的 profile db（<hermes 資料目錄>/profiles/
#     <name>/state.db，路徑相對主 db 實路徑自動定位，兩平台通用，不寫死）。
#   每個 entry 的 episode_cutover 是 **per-profile cutover**（防歷史湧入，
#   同 §5.1 哲學）：**留空（null）＝該 profile 尚未 cutover，不擷取**（scanner
#   誠實回報 pending，不 fail、不影響 default 與其他 profile）。實際時刻由
#   主 session 部署時比照 2.4d-4 runbook 寫入「翻上線當下的精確 UTC 時刻」
#   （見 docs/memory-lifecycle-proposal.md §7 A1 部署 runbook）。
#   entry 也接受 state_db 覆蓋（測試／急救用；生產一律留空走自動定位）。
#   敏感 fail-closed、too_short、去重、--limit 節流全部繼承既有 importer
#   實作——named profile 不新增任何繞過。
episodes:
  enabled: true
  episode_cutover: "2026-07-12T06:36:18Z"
  inactivity_hours: 72
  tool_output_max_chars: 500
  profiles:
    # per-profile cutover 於 2026-07-30 部署時寫入(runbook §7 步驟 7,
    # 取翻上線當下 UTC 時刻)。此值之前的訊息永遠不擷取;不得往前調補掃
    # (要回溯個案用 checkpoint/to-inbox 路徑,見 runbook 特別警告)。
    financialresearch:
      episode_cutover: "2026-07-30T09:15:55Z"
    gptcoding:
      episode_cutover: "2026-07-30T09:15:55Z"
    intelligence:
      episode_cutover: "2026-07-30T09:15:55Z"
    nemocoding:
      episode_cutover: "2026-07-30T09:15:55Z"
