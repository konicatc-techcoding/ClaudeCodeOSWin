# hermes/config/bridge.yaml — v0.1（Stage 2.4a）
#
# Session bridge 的政策層設定。與 cron_jobs.yaml / rss_feeds.yaml 同層慣例：
# 非密鑰、進版控、會被部署同步下發（不在 deployment-sync-plan 的排除清單）。
# 部署側的 runtime 狀態（watermark）另存 hermes/state/bridge_state.db 的
# bridge_meta table，兩者分層：這裡是「底線政策」，那裡是「可拋棄進度」。
#
# cutover：bridge 正式啟用日（UTC ISO 8601）。此時間點之前完結的 session 屬
# pre-bridge 歷史，不在自動掃描範圍（唯一有價值的舊 session 已於 Stage 2.3
# 由 reconcile 回填）。scanner 無 --since / --all-history 時的 effective since
# ＝ max(cutover, watermark)——cutover 是掃描範圍的絕對底線：即使部署側
# bridge_state.db（含 watermark）整個刪掉重建，自動掃描也絕不會越過這個值
# 往前掃到 pre-bridge 歷史。
#
# 變更此值的語義：
# - 往後調＝宣告「此日期前的 session 改列 pre-bridge 歷史」；watermark 較新時
#   effective since 取兩者較大值，已掃過的範圍不受影響。
# - 往前調＝擴大歷史掃描範圍——但 watermark 較新時不會生效（effective since
#   仍取較大值）；真的要回溯補掃請人工帶 --since 執行一次（人工覆蓋不受
#   watermark 影響，且掃完只會把 watermark 往前推、不會往回拉）。
# - scanner 讀不到本檔或缺 cutover 欄位時 fail loud（exit 1），絕不默認全掃。

cutover: "2026-07-10T00:00:00Z"

# max_import_retries（Stage 2.4c）：bridge importer（hermes/bridge_importer.py）
# 對同一 session 匯入失敗後的自動重試上限。前次 failed 的 session 重新嘗試時
# retry_count +1（bridge_state.increment_retry_count 的既定語義，與 jobs.attempts
# 不同層）；retry_count 達此值後不再自動嘗試，狀態轉 needs_review（人工檢視）。
# 欄位缺失時 importer 預設 3；設定檔本身讀不到時 fail loud（比照 cutover 慣例）。
max_import_retries: 3

# episodes（Stage 2.4d，提案 §1.3／§5.1）：Desktop 長壽 session 的 episode
# capture 政策層開關。與上面的 `cutover`（ended_at 掃描範圍底線）是兩個獨立
# 概念，互不綁架——episode_cutover 是「episode 擷取」的底線，不是「掃描層
# 歷史底線」的別名。
#
# - enabled：本階段（2.4d-2）交付後仍是 false——scanner 對 episodes.enabled
#   為 false 或整個區塊缺失時，行為與 2.4c 位元級一致（零成本 gate，矩陣
#   #19 前半）。翻 true 是 2.4d-4 部署驗證通過之後的事，本次交付不得改動。
# - episode_cutover：**刻意留空**（不是留一個假時間戳、也不是隨手填今天）。
#   已拍板（§0.1）：真正的值＝2.4d-4 部署翻 enabled: true 之前，取當下實際
#   UTC 時刻寫入——是時刻不是日期概念值。刻意留空是為了讓
#   「enabled: true 但忘記填 episode_cutover」這個誤用在啟用當下就 fail
#   loud（exit 1，矩陣 #19 後半），而不是被某個預設值悄悄接住、讓自動管線
#   在沒人決定過起點的情況下擷取到不可預期的範圍。
#   （manual checkpoint 子指令對「無 cursor 的 session」同樣需要這個值才能
#   決定擷取起點，缺失時同樣 fail loud——見 bridge_scanner.py checkpoint。）
# - inactivity_hours：已拍板 72（§0.1）——「暫時告一段落」的 checkpoint 門檻，
#   比「過幾天拿出來繼續用」的復用節奏保守；切早了無資料損失，只是同一主題
#   分成兩個 episode，consolidation 會再整併。
episodes:
  enabled: false
  episode_cutover:
  inactivity_hours: 72
